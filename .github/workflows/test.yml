name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python -m py_compile phototidy/*.py phototidy/core/*.py
      - run: pytest tests/ -q

  gui-selftest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[gui]'
      - name: GUI selftest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m phototidy.gui --selftest
      - name: GUI selftest (macOS/Windows)
        if: runner.os != 'Linux'
        run: python -m phototidy.gui --selftest

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scan tracked files for private keywords and common secrets
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          blocked_terms = [
              "yu" + "biao",
              "j" + "d",
              "jing" + "dong",
              "\u4eac\u4e1c",
              "\u4eac" + "me",
              "e" + "rp",
              "@" + "j" + "d",
              "j" + "d" + ".com",
              "joy" + "code",
              "joy" + "space",
              "\u5185\u7f51",
              "\u5de5\u53f7",
              "\u8d26\u53f7",
              "/" + "Users/",
              "Documents/" + "j" + "d",
              "Documents/" + "gitee",
          ]
          sensitive_patterns = [
              re.compile(r"AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}"),
              re.compile(r"gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              re.compile(r"xox[baprs]-[A-Za-z0-9-]{10,}"),
              re.compile(r"-----BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY-----"),
              re.compile(
                  r"(^|[^a-z])(" + "|".join(
                      [
                          "api[_-]?" + "key",
                          "access[_-]?" + "key",
                          "s" + "ecret[_-]?" + "key",
                          "client[_-]?" + "s" + "ecret",
                          "to" + "ken",
                          "pass" + "word",
                          "pass" + "wd",
                          "private[_-]?" + "key",
                          "authorization",
                          "coo" + "kie",
                      ]
                  ) + r")[^\n]{0,120}(:|=)",
                  re.IGNORECASE,
              ),
          ]

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          failures = []
          for path_text in tracked:
              path = Path(path_text)
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              lower = text.lower()
              for term in blocked_terms:
                  if term.lower() in lower:
                      failures.append((path_text, f"blocked term: {term}"))
              for pattern in sensitive_patterns:
                  if pattern.search(text):
                      failures.append((path_text, f"sensitive regex: {pattern.pattern[:40]}"))

          if failures:
              for path_text, reason in failures:
                  print(f"{path_text}: {reason}")
              sys.exit(1)
          PY
