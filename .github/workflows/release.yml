# 打包流水线:双平台构建 + 发布 Release + 同步 Gitee 发行版。
# 公开仓库的 macOS/Windows runner 免费,无需账单。
# 两平台均先跑 --selftest 冒烟检查;产物附带 .sha256 校验和。
#
# 触发与产物:
#   push main    → 更新滚动「latest」Release(每次 push 覆盖,make_latest = true)
#   push tag v*  → 创建固定版本 Release(如 v0.1.0),不抢占 latest(版本锚点)
#   workflow_dispatch → 手动触发,按当前 ref 走上面两条之一
#
# Gitee 同步:仅当仓库 Secrets 配置了 GITEE_TOKEN 时执行;未配置则整段跳过(不亮红灯)。
#   GITEE_TOKEN 申请:Gitee → 设置 → 私人令牌 → 勾选 projects 权限
#   配置位置:GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # push tag 时用 tag 名(如 v0.1.0);push main 时用 latest
  REL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
  # 是否 tag 触发(字符串 'true'/'false')
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install -e '.[gui]' pyinstaller
      - name: 打包(windowed app)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name PhotoTidy --collect-all customtkinter \
            --distpath dist --workpath build scripts/package_gui.py
      - name: 冒烟自检
        run: dist/PhotoTidy.app/Contents/MacOS/PhotoTidy --selftest
      - name: 压缩产物
        run: ditto -c -k --sequesterRsrc --keepParent dist/PhotoTidy.app PhotoTidy-macos.zip
      - name: 生成 SHA256 校验和
        run: shasum -a 256 PhotoTidy-macos.zip > PhotoTidy-macos.zip.sha256
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTidy-macos
          path: |
            PhotoTidy-macos.zip
            PhotoTidy-macos.zip.sha256
          retention-days: 30
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_TAG }}
          # tag 触发时不抢占「latest」,保证滚动版始终指向 main 最新构建
          make_latest: ${{ env.IS_TAG != 'true' }}
          overwrite_files: true
          body: |
            PhotoTidy ${{ env.REL_TAG }}

            - macOS: 解压 PhotoTidy-macos.zip,将 PhotoTidy.app 拖到「应用程序」
            - Windows: 双击 PhotoTidy.exe 运行(绿色软件,不写注册表)

            首次打开需放行:macOS 右键 App → 打开;Windows 点「更多信息 → 仍要运行」。
            国内用户可到 Gitee 镜像下载:https://gitee.com/hummingbird136/PhotoTidy/releases
          files: |
            PhotoTidy-macos.zip
            PhotoTidy-macos.zip.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install -e ".[gui]" pyinstaller
      - name: 打包(单 exe)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile `
            --name PhotoTidy --collect-all customtkinter scripts/package_gui.py
      - name: 冒烟自检
        run: ./dist/PhotoTidy.exe --selftest
      - name: 生成 SHA256 校验和
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/PhotoTidy.exe).Hash.ToLower()
          "$hash  PhotoTidy.exe" | Out-File -Encoding ascii PhotoTidy.exe.sha256
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTidy-windows
          path: |
            dist/PhotoTidy.exe
            PhotoTidy.exe.sha256
          retention-days: 30
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_TAG }}
          make_latest: ${{ env.IS_TAG != 'true' }}
          overwrite_files: true
          body: |
            PhotoTidy ${{ env.REL_TAG }}

            - macOS: 解压 PhotoTidy-macos.zip,将 PhotoTidy.app 拖到「应用程序」
            - Windows: 双击 PhotoTidy.exe 运行(绿色软件,不写注册表)

            首次打开需放行:macOS 右键 App → 打开;Windows 点「更多信息 → 仍要运行」。
            国内用户可到 Gitee 镜像下载:https://gitee.com/hummingbird136/PhotoTidy/releases
          files: |
            dist/PhotoTidy.exe
            PhotoTidy.exe.sha256

  # 双平台产物齐了再同步 Gitee,避免只传一半。
  # 用自写脚本同步(scripts/sync_release_to_gitee.py):直接调用 Gitee 官方 API,
  # release 不存在时用 target_commitish=main 让 Gitee 自动创建 tag。
  # ⚠️ 曾用 YuZhiYuanOrg/release-sync@v1,其手动 POST /tags 建 tag 的参数与官方 API
  #    不符,latest 标签不存在时必然 400 失败(2026-09-11 踩过)。
  # ⚠️ Gitee 单附件 ≤100MB、仓库总附件 ≤1GB;本项目 4 个资产合计约 36MB,远低于限制。
  #
  # ⚠️ 不能用 job 级 `if: secrets.GITEE_TOKEN != ''` —— GitHub 不允许在 jobs.<id>.if 引用
  #    secrets context,会导致表达式求值失败、workflow 0 秒失败(2026-09-10 踩过)。
  #    正确做法:先用一个 step 把 secret 读到 env,输出布尔,后续 step 用该输出做 if。
  sync-gitee:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Gitee 凭证是否已配置
        id: gitee_cred
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "GITEE_TOKEN 已配置,将同步 Gitee 发行版"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITEE_TOKEN 未配置,跳过 Gitee 同步(不影响 GitHub Release)"
          fi
      - name: 下载 macOS 产物
        if: steps.gitee_cred.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: PhotoTidy-macos
          path: assets
      - name: 下载 Windows 产物
        if: steps.gitee_cred.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: PhotoTidy-windows
          path: assets
      - name: 列出待同步资产(对账用,应恰好 4 个)
        if: steps.gitee_cred.outputs.has_token == 'true'
        run: |
          echo "待同步资产:"
          find assets -type f | sort
          echo "资产数: $(find assets -type f | wc -l)"
      - name: 同步到 Gitee 发行版
        if: steps.gitee_cred.outputs.has_token == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RELEASE_TAG: ${{ env.REL_TAG }}
        run: python scripts/sync_release_to_gitee.py
