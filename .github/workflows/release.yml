# 打包流水线:matrix 双平台构建 + 发布 GitHub Release + 同步 Gitee 发行版。
# 公开仓库的 macOS/Windows runner 免费,无需账单。
#
# 构建逻辑统一收敛在 scripts/build.py(CI 与本地发布共用,避免多处参数漂移):
#   - 平台差异(Windows 单 exe / macOS .app→zip)、--selftest 冒烟、sha256 均由该脚本处理
#   - 可发布文件统一输出到 release/
#   - PyInstaller 版本由 build.py 单一锁定,保证构建可复现
#
# 触发与产物:
#   push main       → 更新滚动「latest」Release(每次覆盖,make_latest = true)
#   push tag v*     → 创建固定版本 Release(如 v0.1.0),不抢占 latest
#   workflow_dispatch → 手动触发
#
# Gitee 同步:仅当 Secrets 配置了 GITEE_TOKEN 时执行;未配置则整段跳过(不亮红灯)。
#   GITEE_TOKEN:Gitee → 设置 → 私人令牌 → 勾选 projects 权限
#   配置位置:GitHub 仓库 → Settings → Secrets and variables → Actions
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # push tag 时用 tag 名(如 v0.1.0);push main 时用 latest
  REL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
  # 是否 tag 触发(字符串 'true'/'false')
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # 双平台用 matrix 展开,共享同一套步骤,消除 mac/win 两份重复配置
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    # 只有构建任务需要写 GitHub Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖(锁定 PyInstaller 版本)
        run: pip install -e ".[gui]" "pyinstaller==$(python scripts/build.py --print-pyinstaller-version)"
      - name: 打包并冒烟自检
        run: python scripts/build.py
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTidy-${{ matrix.artifact }}
          path: release/*
          retention-days: 30
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_TAG }}
          # tag 触发时不抢占「latest」,保证滚动版始终指向 main 最新构建
          make_latest: ${{ env.IS_TAG != 'true' }}
          overwrite_files: true
          body: |
            PhotoTidy ${{ env.REL_TAG }}

            - macOS: 解压 PhotoTidy-macos.zip,将 PhotoTidy.app 拖到「应用程序」
            - Windows: 双击 PhotoTidy.exe 运行(绿色软件,不写注册表)

            首次打开需放行:macOS 右键 App → 打开;Windows 点「更多信息 → 仍要运行」。
            国内用户可到 Gitee 镜像下载:https://gitee.com/hummingbird136/PhotoTidy/releases
          files: release/*

  # 双平台产物齐了再同步 Gitee,避免只传一半。
  # 脚本直接调用 Gitee 官方 API,release 不存在时用 target_commitish=main 自动建 tag。
  # 详见 scripts/sync_release_to_gitee.py(含超时/重试,跨境上传较慢属正常)。
  sync-gitee:
    needs: build
    runs-on: ubuntu-latest
    # 同步只访问 Gitee,不需要 GitHub 写权限(最小权限原则)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Gitee 凭证是否已配置
        id: gitee_cred
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "GITEE_TOKEN 已配置,将同步 Gitee 发行版"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITEE_TOKEN 未配置,跳过 Gitee 同步(不影响 GitHub Release)"
          fi
      - name: 下载 macOS 产物
        if: steps.gitee_cred.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: PhotoTidy-macos
          path: assets
      - name: 下载 Windows 产物
        if: steps.gitee_cred.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: PhotoTidy-windows
          path: assets
      - name: 列出待同步资产(对账用,应恰好 4 个)
        if: steps.gitee_cred.outputs.has_token == 'true'
        run: |
          echo "待同步资产:"
          find assets -type f | sort
          echo "资产数: $(find assets -type f | wc -l)"
      - name: 同步到 Gitee 发行版
        if: steps.gitee_cred.outputs.has_token == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RELEASE_TAG: ${{ env.REL_TAG }}
        run: python scripts/sync_release_to_gitee.py
