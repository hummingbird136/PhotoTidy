# 发布流水线:打 tag(v*)时双平台打包并上传 GitHub Releases
# macOS 与 Windows 分别构建;构建后立即用 --selftest 做产物健康检查。
# 产物不可变原则:每个安装包附带 .sha256 校验和文件一并上传。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # python.org 官方安装器自带 Tcl/Tk(brew python-tk 在受限环境有 TCC 问题)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install -e '.[gui]' pyinstaller
      - name: 打包(windowed app)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name PhotoTidy --collect-all customtkinter \
            --distpath dist --workpath build scripts/package_gui.py
      - name: 冒烟自检
        run: dist/PhotoTidy.app/Contents/MacOS/PhotoTidy --selftest
      - name: 压缩产物
        run: ditto -c -k --sequesterRsrc --keepParent dist/PhotoTidy.app PhotoTidy-macos.zip
      - name: 生成 SHA256 校验和
        run: shasum -a 256 PhotoTidy-macos.zip > PhotoTidy-macos.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PhotoTidy-macos.zip
            PhotoTidy-macos.zip.sha256
            LICENSE
            THIRD_PARTY_NOTICES.md

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install -e ".[gui]" pyinstaller
      - name: 打包(单 exe)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile `
            --name PhotoTidy --collect-all customtkinter scripts/package_gui.py
      - name: 冒烟自检
        run: ./dist/PhotoTidy.exe --selftest
      - name: 生成 SHA256 校验和
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/PhotoTidy.exe).Hash.ToLower()
          "$hash  PhotoTidy.exe" | Out-File -Encoding ascii PhotoTidy.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PhotoTidy.exe
            PhotoTidy.exe.sha256
            LICENSE
            THIRD_PARTY_NOTICES.md
